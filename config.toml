[hyperliquid]
ws_url = "wss://api.hyperliquid.xyz/ws"

[bitget]
ws_url = "wss://ws.bitget.com/v2/ws/public"

[clock_monitor]
enabled = true
ntp_servers = [
    "pool.ntp.org",
    "time.aws.com",
    "time.google.com",
    "time.cloudflare.com",
]
poll_interval_secs = 30
threshold_micros = 10000
query_timeout_secs = 5
jitter_window_size = 20
breach_action = "warn"
warn_on_breach = true

[reconnect]
initial_backoff_ms = 1000
max_backoff_ms = 30000
jitter_pct = 0.2

[candle_buffer]
size = 500
stale_threshold_secs = 300
fetch_timeout_ms = 30000
sub_minute_skip_historical = true

[workspace]
id = "main"
name = "My Portfolio"
default_currency = "USDC"
default_exchange = "Hyperliquid"
config_version = 0
execution_policies = []

[workspace.candles]
duration_seconds = 60

[workspace.indicators]
ema_fast = 10
ema_medium = 50
ema_slow = 100
ema_long = 200
rsi_period = 14
macd_fast = 12
macd_slow = 26
