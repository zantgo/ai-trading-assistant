symbols = [
    "Hyperliquid:BTC",
    "Hyperliquid:ETH",
    "Hyperliquid:SOL",
]

[candles]
duration_seconds = 60
analysis_limit = 100

[indicators]
ema_fast = 10
ema_medium = 50
ema_slow = 100
ema_long = 200
rsi_period = 14
macd_fast = 12
macd_slow = 26
macd_signal = 9
adx_period = 14
atr_period = 14
squeeze_period = 20
bbwp_lookback = 252
bbwp_period = 20
macd_extreme_high_threshold = 1000.0
macd_extreme_low_threshold = -1000.0
macd_histogram_contraction_threshold = 0.3
adx_trend_threshold = 20
adx_exhaustion_threshold = 40
adx_slope_lookback = 3
squeeze_min_duration = 5
squeeze_bb_period = 20
squeeze_bb_std_dev = 2.0
squeeze_kc_period = 20
squeeze_kc_atr_multiplier = 1.5
atr_multiplier_coefficient = 2.0
atr_target_rr_ratio = 2.5
volume_average_period = 20
rvol_threshold_institutional = 1.5
rvol_threshold_climax = 3.0

[hyperliquid]
ws_url = "wss://api.hyperliquid.xyz/ws"

[fibonacci]
swing_lookback = 10
swing_scan_range = 120
retracement_coefficients = [
    0.236,
    0.382,
    0.5,
    0.618,
    0.66,
    0.786,
]
extension_coefficients = [
    1.272,
    1.618,
    2.0,
    2.618,
]

[pivots]
strength_n = 10
scan_range_candles = 120
sr_proximity_threshold_pct = 0.5
sr_flip_tolerance_pct = 0.3
pattern_slope_tolerance = 0.2

[macro_timeframe]
enabled = true
duration_seconds = 900
analysis_limit = 100

[supermacro_timeframe]
enabled = true
duration_seconds = 3600
analysis_limit = 100

[leverage]
cross_leverage = 20

[scoring]
rsi_weight = 10
rsi_divergence_weight = 20
macd_weight = 10
macd_divergence_weight = 10
support_resistance_weight = 10
trend_weight = 20
ema200_weight = 10
pattern_weight = 10
base_allocation_pct = 1.0
mid_allocation_pct = 2.0
max_allocation_pct = 3.0
base_score_threshold = 40
mid_score_threshold = 60

[fees]
maker_fee_pct = 0.02
taker_fee_pct = 0.06

[costs]
price_per_1m_input_tokens = 0.27
price_per_1m_output_tokens = 1.1

[workspace]
max_instances = 100
default_pair = "BTC/USDT"

[safety]
consecutive_loss_caution = 3
consecutive_loss_dropout = 5
dropout_duration_hours = 8
capital_drawdown_pct = 30.0

[intervals]
slow_seconds = 3600
normal_seconds = 900
fast_seconds = 300

[api_failover]
max_retries_per_call = 5
retry_delay_seconds = 30
max_consecutive_failures = 10
