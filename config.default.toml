# config.default.toml
# Standard fallback configuration template.
# DO NOT edit this file directly — copy or edit config.toml instead.
# The engine reads config.toml from CWD at runtime.
# If config.toml is missing, the engine falls back to this file.

symbols = ["Hyperliquid:BTC"]

# ─── Candle & Timeframe Configuration ─────────────────────────────
# The platform uses 4 configurable timeframes per Market Instance:
#   micro (fastest) → fast → slow → macro (slowest)
# Defaults shown below; each can be changed per session via config.toml.

[candles]
duration_seconds = 60          # micro timeframe (default: 1 min)
analysis_limit = 500           # warm-up lookback depth (bars)

[fast_timeframe]
enabled = true
duration_seconds = 180         # fast timeframe (default: 3 min)

[slow_timeframe]
enabled = true
duration_seconds = 300         # slow timeframe (default: 5 min)

[macro_timeframe]
enabled = true
duration_seconds = 900         # macro timeframe (default: 15 min)

# ─── Technical Indicator Periods ──────────────────────────────────

[indicators]
# Trend
ema_fast = 10
ema_medium = 50
ema_slow = 100
ema_long = 200
supertrend_period = 10
supertrend_multiplier = 3.0
keltner_ema_period = 20
keltner_atr_period = 10
keltner_multiplier = 2.0
donchian_period = 20
adx_period = 14
adx_trend_threshold = 20
adx_exhaustion_threshold = 40
adx_slope_lookback = 3
ichimoku_tenkan = 9
ichimoku_kijun = 26
ichimoku_senkou_b = 52
ichimoku_displacement = 26
psar_af_step = 0.02
psar_af_max = 0.2
hull_ma_period = 21

# Momentum
rsi_period = 14
macd_fast = 12
macd_slow = 26
macd_signal = 9
macd_extreme_high_threshold = 1000.0
macd_extreme_low_threshold = -1000.0
macd_histogram_contraction_threshold = 0.3
stoch_k_period = 18
stoch_d_period = 5
stoch_s_period = 9
chandemo_period = 12
williams_r_period = 14
cci_period = 20

# Volume
obv_smoothing = 20
cmf_period = 20
mfi_period = 14
force_index_smoothing = 13
volume_average_period = 20
rvol_threshold_institutional = 1.5
rvol_threshold_climax = 3.0
volume_profile_bins = 50
volume_profile_window = 500
volume_profile_value_area = 0.7

# Volatility
atr_period = 14
atr_multiplier_coefficient = 2.0
atr_target_rr_ratio = 2.5
squeeze_period = 20
squeeze_min_duration = 5
squeeze_bb_period = 20
squeeze_bb_std_dev = 2.0
squeeze_kc_period = 20
squeeze_kc_atr_multiplier = 1.5
bbwp_lookback = 252
bbwp_period = 20
hv_period = 20
stddev_channel_period = 20

# Regime
aroon_period = 25
chop_period = 14
linreg_period = 20
zscore_period = 20

# SMC / Institutional
smc_lookback = 20

# ─── Fibonacci & Pivot Configuration ──────────────────────────────

[fibonacci]
swing_lookback = 10
swing_scan_range = 120
retracement_coefficients = [
    0.236,
    0.382,
    0.5,
    0.618,
    0.66,
    0.786,
]
extension_coefficients = [
    1.272,
    1.618,
    2.0,
    2.618,
]

[pivots]
strength_n = 10
scan_range_candles = 120
sr_proximity_threshold_pct = 0.5
sr_flip_tolerance_pct = 0.3
pattern_slope_tolerance = 0.2

# ─── Exchange Endpoints ──────────────────────────────────────────

[hyperliquid]
ws_url = "wss://api.hyperliquid.xyz/ws"

[bitget]
ws_url = "wss://ws.bitget.com/v2/ws/public"

# ─── Risk & Leverage ──────────────────────────────────────────────

[leverage]
cross_leverage = 20

[scoring]
base_allocation_pct = 1.0
micro_allocation_pct = 2.0
max_allocation_pct = 3.0
base_score_threshold = 40
micro_score_threshold = 60

[fees]
maker_fee_pct = 0.02
taker_fee_pct = 0.06
funding_rate_8h = 0.01

[defaults]
default_pair = "BTC/USDT"

# ─── Safety Circuit Breakers ──────────────────────────────────────

[safety]
consecutive_loss_caution = 3
consecutive_loss_dropout = 5
dropout_duration_hours = 8
capital_drawdown_pct = 30.0

# ─── Trigger Intervals ────────────────────────────────────────────

[intervals]
slow_seconds = 3600
normal_seconds = 900
fast_seconds = 300
