[package]
name = "config-models"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1", features = ["fs", "macros"] }
thiserror = "1.0"
rust_decimal = { version = "1.34", features = ["serde-with-str"] }