[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[dependencies]
# Local workspace libraries
shared = { path = "../shared" }

# Async runtime
tokio = { version = "1.36", features = ["full"] }

# Decimal implementation
rust_decimal = { version = "1.34", features = ["serde-with-str"] }
rust_decimal_macros = "1"

# WebSocket execution & streams
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# URL Parsing
url = "2.5"

# Process-level Cryptography Provider
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# SQL Database Client
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }

# Web Server & Static Directory Service
axum = { version = "0.7", features = ["ws", "json"] } # added json support for config API
tower-http = { version = "0.5", features = ["fs", "cors"] }

# TOML configuration file deserializer (added)
toml = "0.8"

# JSON deserialization
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

# HTTP client for REST API calls
reqwest = { version = "0.12", features = ["json"] }

# Cancellation token for graceful task shutdown
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"

# Async trait support
async-trait = "0.1"

# Error enum derive
thiserror = "1.0"

# Timestamp parsing for Kraken/Coinbase RFC3339
chrono = "0.4"

# Base64 encoding for credential storage
base64 = "0.22"

# AES-256-GCM encryption for exchange credentials
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"

# NTP client for the ClockMonitor — enforces the platform's <=50µs UTC drift budget
# via continuous polling. sntpc 0.3 only ships a synchronous `simple_get_time` over
# std::net::UdpSocket; we integrate it with tokio via `tokio::task::spawn_blocking`
# + a per-query socket read timeout (no `tokio` feature exists in this version).
sntpc = { version = "0.3", features = ["std"] }

# Terminal input with history and line editing (CLI mode removed)
# rustyline = "15"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
hyper = { version = "1", features = ["server"] }
http-body-util = "0.1"
